<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/a.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Greek Gods Hierarchy</title>
    <style>
      html,
      body {
        height: 100%;
      }
      body {
        background-color: black;
        color: #aaa;
        font-family: Helvetica, sans-serif;
        margin: 0;
      }
      #page {
        width: 100%;
        height: 100%;
        position: relative;
      }
      #canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        background-color: #111;
      }
      #layout-controls {
        position: absolute;
        top: 16px;
        left: 16px;
        z-index: 25;
        background: rgba(14, 16, 22, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.24);
        border-radius: 10px;
        padding: 10px 12px;
        color: #f2f2f2;
        font-size: 13px;
        line-height: 1.3;
      }
      #layout-controls legend {
        padding: 0;
        margin-bottom: 6px;
        font-weight: 700;
      }
      #layout-controls label {
        display: block;
        margin: 4px 0;
        cursor: pointer;
      }
      #layout-controls input {
        margin-right: 6px;
      }
    </style>
  </head>
  <body>
    <div id="page">
      <fieldset id="layout-controls">
        <legend>Layout</legend>
        <label>
          <input
            type="radio"
            name="layout-mode"
            value="hierarchy"
            checked
          />
          Hierarchical
        </label>
        <label>
          <input type="radio" name="layout-mode" value="radial" />
          Hierarchical Radial
        </label>
      </fieldset>
      <canvas id="canvas"></canvas>
    </div>
    <script type="module" src="/src/pages/graph8.ts"></script>
  </body>
</html>
